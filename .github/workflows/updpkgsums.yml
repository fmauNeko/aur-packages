name: updpkgsums

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

permissions:
  contents: write

jobs:
  find-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find_pkgbuilds.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Find updated packages
        id: find_pkgbuilds
        run: |
          #!/usr/bin/env bash
          set -euxo pipefail

          # Get all modified PKGBUILDs and their directories
          pkgbuilds=$(git diff --name-only origin/main origin/${GITHUB_HEAD_REF} "*PKGBUILD" | xargs -I {} dirname {} | sort -u)

          # Convert to JSON array for matrix
          if [ -n "$pkgbuilds" ]; then
            echo "packages=$(echo "$pkgbuilds" | jq -R . | jq -sc .)" >> $GITHUB_OUTPUT
          else
            echo "packages=[]" >> $GITHUB_OUTPUT
          fi

  updpkgsums:
    needs: find-packages
    if: ${{ fromJSON(needs.find-packages.outputs.packages)[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.find-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Free up disk space
        if: contains(matrix.package, 'factorio')
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

      - name: Validate package
        uses: ./.github/actions/aur
        with:
          action: "updpkgsums"
          pkgname: ${{ matrix.package }}
        env:
          FACTORIO_LOGIN: ${{ contains(matrix.package, 'factorio') && secrets.FACTORIO_USERNAME || '' }}
          FACTORIO_TOKEN: ${{ contains(matrix.package, 'factorio') && secrets.FACTORIO_TOKEN || '' }}

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          file_pattern: "*/PKGBUILD */.SRCINFO"
